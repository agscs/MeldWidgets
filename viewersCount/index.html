<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LiveViewers Widget v0.1.42</title>
	<style>
		:root {
			--font-color: #9146ff;
			--font-size: 50px;
			--font-weight: 600;
			--font-family: "Arial", sans-serif;
			--icon-size: 50px;
		}

		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			width: 100%;
			background: transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: var(--font-family);
			color: var(--font-color);
			font-size: var(--font-size);
			font-weight: var(--font-weight);
		}

		#viewerWrap {
			text-align: center;
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: 6px;
		}

		#viewerCount {
			line-height: 1;
			transition: all 0.25s ease;
			transition: transform 0.25s ease;
		}

		#viewerCount.pulse {
			animation: pulse 0.3s ease-in-out;
		}

		.icon {
			width: var(--icon-size);
			height: var(--icon-size);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			color: var(--font-color);
		}

		.icon svg {
			width: 100%;
			height: 100%;
			fill: currentColor;
			stroke: none;
		}

		.small-note {
			font-size: 0.6em;
			opacity: 0.75;
		}

		@keyframes pulse {
			0% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.1);
			}

			100% {
				transform: scale(1);
			}
		}
	</style>
	<script src="https://widgets.meldstudio.co/v1/qwebchannel-v1.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.8.2/countUp.umd.js"></script>
</head>

<body>
	<div id="viewerWrap">
		<div id="platformIcon" class="icon" aria-hidden="true"></div>
		<div id="viewerCount">?</div>
	</div>
	<script type="text/javascript">
		'use strict';

		/* Schema & widget basics */
		const kSchema = {
			schemaVersion: 1,
			name: "LiveViewers (v0.1.42)",
			author: "PHPkiller [phpkiller.me]",
			properties: [
				{ name: "platform", type: "string", defaultValue: "twitch" },
				{ name: "username", type: "string", defaultValue: "chocotaco247" },
				{ name: "youtubeApiKey", type: "string", defaultValue: "" },
				{ name: "refreshRate", type: "int", defaultValue: 30 },
				{ name: "fontFamily", type: "string", defaultValue: "Arial" },
				{ name: "fontColor", type: "color", defaultValue: "#9146ff" },
				{ name: "fontSize", type: "int", defaultValue: 50 },
				{ name: "fontWeight", type: "string", defaultValue: "600" },
				{ name: "iconSize", type: "int", defaultValue: 50 }
			],
			signals: [
				{ name: "refreshCount" }
			],
			controls: [
				{ controlType: "Button", label: "Refresh Viewers Count", triggerSignalOnClick: "refreshCount", toolTip: "Fetch the latest viewer count immediately." },
				{ controlType: "Separator" },
				{ controlType: "Label", text: "Platform Settings:" },
				{ controlType: "ComboBox", label: "Platform", property: "platform", items: ["twitch", "kick", "youtube"], tooltip: "The platform to fetch the viewer count from." },
				{ controlType: "TextField", label: "Username / Channel ID", property: "username", tooltip: "The username or channel ID of the platform." },
				{ controlType: "TextField", label: "YouTube API Key (Only if using YouTube)", property: "youtubeApiKey", tooltip: "Required for YouTube live viewer count." },
				{ controlType: "Separator" },
				{ controlType: "Label", text: "Text Settings:" },
				{ controlType: "FontPicker", label: "Font Family", property: "fontFamily", tooltip: "Set the font family of the text." },
				{ controlType: "ColorTextField", label: "Font Color", property: "fontColor", tooltip: "The color of the text." },
				{ controlType: "SpinBox", label: "Font Size", property: "fontSize", from: 8, to: 100, tooltip: "The size of the text." },
				{ controlType: "ComboBox", label: "Font Weight", property: "fontWeight", items: ["300", "400", "500", "600", "700", "800", "900"], tooltip: "The weight of the text." },
				{ controlType: "SpinBox", label: "Icon Size (px)", property: "iconSize", from: 8, to: 100, tooltip: "The size of the icon." },
				{ controlType: "Separator" },
				{ controlType: "Label", text: "Viewers Refresh Settings:" },
				{ controlType: "SpinBox", label: "Refresh Rate (sec)", property: "refreshRate", from: 5, to: 300, tooltip: "Refresh number of viewers every X seconds." },
			]
		};

		const Widget = {
			id: "LiveViewersWidget-" + Math.floor(Math.random() * 999999),
			socket: null,
			channel: null,
			controller: null,
			hasSetupState: false,
			cachedPropertyValues: {},
			refreshTimer: null,
			reconnectTimeout: null
		};

		const viewerWrapEl = document.getElementById('viewerWrap');
		const viewerCountEl = document.getElementById('viewerCount');
		const platformIconEl = document.getElementById('platformIcon');

		const platformIcons = {
			twitch: `<svg xml:space="preserve" viewBox="0 0 2400 2800"><path fill="#fff" d="m2200 1300-400 400h-400l-350 350v-350H600V200h1600z"/><g fill="#9146ff"><path d="M500 0 0 500v1800h600v500l500-500h400l900-900V0H500zm1700 1300-400 400h-400l-350 350v-350H600V200h1600v1100z"/><path d="M1700 550h200v600h-200zm-550 0h200v600h-200z"/></g></svg>`,
			youtube: `<svg preserveAspectRatio="xMidYMid" viewBox="0 0 256 180"><path fill="red" d="M250.346 28.075A32.18 32.18 0 0 0 227.69 5.418C207.824 0 127.87 0 127.87 0S47.912.164 28.046 5.582A32.18 32.18 0 0 0 5.39 28.24c-6.009 35.298-8.34 89.084.165 122.97a32.18 32.18 0 0 0 22.656 22.657c19.866 5.418 99.822 5.418 99.822 5.418s79.955 0 99.82-5.418a32.18 32.18 0 0 0 22.657-22.657c6.338-35.348 8.291-89.1-.164-123.134Z"/><path fill="#FFF" d="m102.421 128.06 66.328-38.418-66.328-38.418z"/></svg>`,
			kick: `<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill-rule="evenodd" clip-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2"><path d="M37 .036h164.448v113.621h54.71v-56.82h54.731V.036h164.448v170.777h-54.73v56.82h-54.711v56.8h54.71v56.82h54.73V512.03H310.89v-56.82h-54.73v-56.8h-54.711v113.62H37V.036z" fill="#53fc18"/></svg>`
		};

		/* -------- API fetchers (public endpoints) -------- */
		async function fetchViewers(platform, username) {
			switch (platform) {
				case "twitch": return await getTwitch(username);
				case "kick": return await getKick(username);
				case "youtube": return await getYouTube(username);
				default: return 0;
			}
		}

		async function getTwitch(user) {
			try {
				const res = await fetch(`https://decapi.me/twitch/viewercount/${encodeURIComponent(user)}`);
				const text = await res.text();
				return text.includes("offline") ? 0 : parseInt(text, 10) || 0;
			} catch (e) { return 0; }
		}

		async function getKick(user) {
			try {
				const res = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(user)}`);
				const data = await res.json();
				return data?.livestream?.viewer_count ?? data?.livestream?.viewers ?? 0;
			} catch (e) { return 0; }
		}

		const youtubeChannelCache = {};

		async function resolveYouTubeChannelId(input, apiKey) {
			if (!input || !apiKey) return "";
			input = String(input).trim();
			// Standard 24-char UC channel ID
			if (/^UC[a-zA-Z0-9_-]{22}$/.test(input)) {
				return input;
			}
			if (youtubeChannelCache[input]) {
				return youtubeChannelCache[input];
			}
			try {
				// 1. Try as handle
				const handle = input.startsWith("@") ? input.substring(1) : input;
				const handleUrl = `https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${encodeURIComponent(handle)}&key=${encodeURIComponent(apiKey)}`;
				const handleRes = await fetch(handleUrl);
				const handleData = await handleRes.json();
				if (handleData.items && handleData.items.length) {
					const id = handleData.items[0].id;
					youtubeChannelCache[input] = id;
					return id;
				}

				// 2. Try as legacy username
				const userUrl = `https://www.googleapis.com/youtube/v3/channels?part=id&forUsername=${encodeURIComponent(input)}&key=${encodeURIComponent(apiKey)}`;
				const userRes = await fetch(userUrl);
				const userData = await userRes.json();
				if (userData.items && userData.items.length) {
					const id = userData.items[0].id;
					youtubeChannelCache[input] = id;
					return id;
				}
			} catch (e) {
				console.warn("[YouTube] Error resolving channel ID:", e);
			}
			return input;
		}

		async function getYouTube(channelInput) {
			const apiKey = Widget.cachedPropertyValues.youtubeApiKey;
			if (!apiKey || !channelInput) return 0;
			try {
				const channelId = await resolveYouTubeChannelId(channelInput, apiKey);
				if (!channelId) return 0;

				const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=id&channelId=${encodeURIComponent(channelId)}&eventType=live&type=video&key=${encodeURIComponent(apiKey)}`;
				const searchRes = await fetch(searchUrl);
				const searchData = await searchRes.json();
				if (!searchData.items || !searchData.items.length) {
					console.warn("[YouTube] No live streams currently running.");
					return 0;
				}
				const liveVideoId = searchData.items[0].id.videoId;
				if (!liveVideoId) return 0;
				const statsUrl = `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${liveVideoId}&key=${encodeURIComponent(apiKey)}`;
				const statsRes = await fetch(statsUrl);
				const statsData = await statsRes.json();
				const viewers = parseInt(statsData?.items?.[0]?.liveStreamingDetails?.concurrentViewers ?? "0", 10);
				return viewers || 0;
			} catch (err) {
				console.error("[YouTube] API error:", err);
				return 0;
			}
		}

		/* -------- Display logic & update hooks -------- */
		const CountUp = window.countUp.CountUp;
		let countUp = null;
		let currentValue = 0;

		async function updateViewers() {
			const { platform = 'twitch', username = '' } = Widget.cachedPropertyValues;
			const count = await fetchViewers(platform, username);
			const newValue = parseInt(count, 10) || 0;
			if (!countUp) {
				countUp = new CountUp(viewerCountEl, newValue, {
					startVal: 0,
					duration: 0.8,
					useEasing: true,
					useGrouping: true,
					separator: ','
				});
				if (!countUp.error) countUp.start();
				currentValue = newValue;
				return;
			}
			if (newValue !== currentValue) {
				countUp.update(newValue);
				currentValue = newValue;
				viewerCountEl.classList.add('pulse');
				setTimeout(() => viewerCountEl.classList.remove('pulse'), 300);
			}
		}

		/* Apply font and icon sizing styles */
		function applyStyles(state) {
			if (!state) return;
			const iconSize = (state.iconSize !== undefined) ? state.iconSize : 50;
			document.documentElement.style.setProperty('--font-color', state.fontColor ?? '#9146ff');
			document.documentElement.style.setProperty('--font-size', (state.fontSize ?? 50) + 'px');
			document.documentElement.style.setProperty('--font-weight', state.fontWeight ?? '600');
			document.documentElement.style.setProperty('--font-family', state.fontFamily ?? 'Arial');
			document.documentElement.style.setProperty('--icon-size', iconSize + 'px');
		}

		/* Insert or update icon element — inline SVG using original colors */
		function renderIcon(platform) {
			platformIconEl.innerHTML = '';
			platformIconEl.innerHTML = platformIcons[platform] || platformIcons["twitch"];
		}

		/* ---------- URL Hash Management & Property Handling ---------- */
		function readPropertyFromUrlOrDefault(propertyData) {
			const hash = window.location.hash.substring(1);
			const params = new URLSearchParams(hash);
			let value = propertyData.defaultValue;
			if (params.has(propertyData.name)) {
				let raw = params.get(propertyData.name);
				try { raw = decodeURIComponent(raw); } catch (e) { }
				switch (propertyData.type) {
					case "int": {
						const n = parseInt(raw, 10);
						return isNaN(n) ? propertyData.defaultValue : n;
					}
					case "real": {
						const f = parseFloat(raw);
						return isNaN(f) ? propertyData.defaultValue : f;
					}
					case "bool":
						return String(raw).toLowerCase() === "true";
					case "color":
						return String(raw).toLowerCase();
					case "string":
					default:
						return raw;
				}
			}
			return value;
		}

		function eventReceived(evt) {
			const { signal } = evt || {};
			if (signal === "refreshCount") {
				console.log("[LiveViewers] refreshCount signal received via eventReceived");
				updateViewers();
			}
		}

		/* -------- Meld Controller Binding -------- */
		function widgetControllerInit(controller) {
			Widget.controller = controller;
			controller.connectedClientId = Widget.id;

			controller.connectedClientIdChanged = (() => {
				const socket = Widget.socket;
				const newConnectedClientId = Widget.controller.connectedClientId;
				if (socket && Widget.id !== newConnectedClientId) {
					console.log(`[LiveViewers] Closing widget client (${Widget.id}) socket, another client connected (${newConnectedClientId})`);
					Widget.socket.close(1000, "Another client connected.");
				}
			});

			controller.schema = kSchema;

			try {
				controller.eventReceived.connect(eventReceived);
			} catch (e) { }

			controller.stateChanged.connect(() => {
				console.log(`[LiveViewers] stateChanged: ${controller.state} hasSetupState: ${Widget.hasSetupState}`);
				if (!controller.state || Widget.hasSetupState) return;

				for (const property of kSchema.properties) {
					setupProperty(property);
				}

				if (controller.state.refreshCount) {
					try {
						controller.state.refreshCount.connect(() => {
							console.log("[LiveViewers] refreshCount signal received");
							updateViewers();
						});
					} catch (e) { }
				}

				applyStyles(Widget.cachedPropertyValues);
				renderIcon(Widget.cachedPropertyValues.platform);
				if (Widget.refreshTimer) clearInterval(Widget.refreshTimer);
				const rate = parseInt(Widget.cachedPropertyValues.refreshRate, 10);
				Widget.refreshTimer = setInterval(updateViewers, (isNaN(rate) ? 30 : rate) * 1000);

				Widget.hasSetupState = true;
			});

			controller.resetProperty.connect((propertyName) => {
				if (!Widget.hasSetupState) return;
				const prop = kSchema.properties.find(p => p.name === propertyName);
				if (prop) {
					controller.state[prop.name] = prop.defaultValue;
				}
			});

			controller.resetAllProperties.connect(() => {
				if (!Widget.hasSetupState) return;
				for (const prop of kSchema.properties) {
					controller.state[prop.name] = prop.defaultValue;
				}
			});

			function setupProperty(propertyData) {
				const state = Widget.controller && Widget.controller.state;
				if (!state) return;

				const value = readPropertyFromUrlOrDefault(propertyData);
				Widget.cachedPropertyValues[propertyData.name] = value;

				// Always sync URL value into Meld controller state so inspector controls show it
				state[propertyData.name] = value;

				try {
					state[propertyData.name + "Changed"].connect(() => handlePropertyUpdate(propertyData));
				} catch (e) {
					console.warn(`[LiveViewers] No change signal for "${propertyData.name}"`);
				}
			}

			function handlePropertyUpdate(propertyData) {
				const state = controller && controller.state;
				if (!state) return;

				let newPropertyValue = state[propertyData.name];
				let defaultValue = propertyData.defaultValue;

				if (newPropertyValue === undefined || newPropertyValue === null) {
					newPropertyValue = "";
				}

				if (propertyData.type === "color" && typeof newPropertyValue === "string") {
					newPropertyValue = newPropertyValue.toLowerCase();
					defaultValue = String(defaultValue).toLowerCase();
				}
				if (typeof newPropertyValue === "string") {
					try { newPropertyValue = decodeURIComponent(newPropertyValue); } catch (e) { }
				}

				Widget.cachedPropertyValues[propertyData.name] = newPropertyValue;
				debugLog("Property updated:", propertyData.name, "=", newPropertyValue);

				// Persist to the URL hash so the value survives reload in MeldStudio
				const oldUrlStr = window.location.href;
				const newUrl = new URL(window.location);
				const hashSearchParams = new URLSearchParams(newUrl.hash.substring(1));

				const isDefault = (propertyData.type === "color")
					? String(newPropertyValue).toLowerCase() === String(defaultValue).toLowerCase()
					: String(newPropertyValue) === String(defaultValue);

				if (isDefault) {
					hashSearchParams.delete(propertyData.name);
				} else {
					hashSearchParams.set(propertyData.name, String(newPropertyValue));
				}

				const hashString = hashSearchParams.toString();
				newUrl.hash = hashString.length ? "#" + hashString : "";
				const newUrlStr = newUrl.toString();

				if (newUrlStr !== oldUrlStr) {
					window.history.pushState({}, "", newUrlStr);
					try {
						controller.updateUrl(newUrlStr, false);
					} catch (e) {
						debugLog("updateUrl failed:", e);
					}
				}

				// Visual & timer refresh immediately
				if (["fontColor", "fontSize", "fontWeight", "fontFamily", "iconSize"].includes(propertyData.name)) {
					applyStyles(Widget.cachedPropertyValues);
					renderIcon(Widget.cachedPropertyValues.platform);
				}
				if (["platform", "username", "youtubeApiKey"].includes(propertyData.name)) {
					if (propertyData.name === "platform") renderIcon(newPropertyValue);
					updateViewers();
				}
				if (propertyData.name === "refreshRate") {
					if (Widget.refreshTimer) clearInterval(Widget.refreshTimer);
					const rate = parseInt(newPropertyValue, 10);
					Widget.refreshTimer = setInterval(updateViewers, (isNaN(rate) ? 30 : rate) * 1000);
				}
			}
		}

		/* -------- Socket connection & add-to-Meld helper -------- */
		function connectSocket() {
			if (Widget.reconnectTimeout !== null) {
				clearTimeout(Widget.reconnectTimeout);
				Widget.reconnectTimeout = null;
			}
			function attemptReconnect() {
				if (Widget.reconnectTimeout !== null) return;
				Widget.reconnectTimeout = setTimeout(connectSocket, 1000);
			}

			const params = new URLSearchParams(window.location.search);
			const address = params.get("address") ?? "127.0.0.1";
			const port = params.get("port") ?? "55255";
			const widgetId = params.get("widget_id") ?? Widget.id;

			let socket;
			try {
				socket = new WebSocket(`ws://${address}:${port}`);
			} catch (err) {
				console.error("[LiveViewers] WebSocket failed:", err);
				attemptReconnect();
				return;
			}
			Widget.socket = socket;

			socket.onopen = function () {
				if (Widget.reconnectTimeout !== null) {
					clearTimeout(Widget.reconnectTimeout);
					Widget.reconnectTimeout = null;
				}
				Widget.channel = new QWebChannel(socket, function (channel) {
					const objects = channel.objects || {};
					const obj = objects[widgetId] || objects[Object.keys(objects)[0]];
					console.log("[LiveViewers] Widget ID:", widgetId, obj ? "Widget Found" : "Widget Not Found");
					if (obj) {
						widgetControllerInit(obj);
					} else {
						console.warn("[LiveViewers] Widget object not found in QWebChannel objects.");
					}
				});
			};
			socket.onclose = () => {
				if (Widget.socket === socket) {
					console.warn("[LiveViewers] Lost connection. Retrying...");
					attemptReconnect();
				}
			};
			socket.onerror = (e) => console.error("[LiveViewers] socket error", e);
		}

		function openInMeldStudio() {
			const params = new URLSearchParams(window.location.search);
			if (!params.has("address")) {
				const widgetDict = {
					width: 400,
					height: 200,
					widgetSource: window.location.href.split("#")[0] + window.location.hash,
					meta: {
						pluginName: "MeldStudio",
						pluginPath: "qrc:/Meld/SceneEditor/Plugins/MeldStudio/plugin_MeldStudio.qml",
						sceneObjectSourceName: "MeldStudio/Widget"
					}
				};
				const pasteDict = { app: "meld", action: "paste-selection", data: [widgetDict] };
				window.location.assign(`meld://action/paste?mime-type=${encodeURIComponent("application/json")}&data=${encodeURIComponent(JSON.stringify(pasteDict))}`);
				return true;
			}
			return false;
		}

		/* -------- Boot -------- */
		window.onload = () => {
			for (let property of kSchema.properties) {
				Widget.cachedPropertyValues[property.name] = readPropertyFromUrlOrDefault(property);
			}
			renderIcon(Widget.cachedPropertyValues.platform);
			viewerCountEl.textContent = '?';
			applyStyles(Widget.cachedPropertyValues);
			updateViewers();
			connectSocket();
			if (openInMeldStudio()) return;
		};

		function debugLog(...args) {
			console.log("[LiveViewers DEBUG]", ...args);
		}
		window.addEventListener('hashchange', () => {
			debugLog("Hash changed externally:", window.location.hash);
		});
	</script>
</body>

</html>
